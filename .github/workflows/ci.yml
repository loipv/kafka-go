name: ci
on:
  push: {branches: [main]}
  pull_request:
  schedule: [{cron: "23 3 * * *"}]
  workflow_dispatch: # run by hand on the release PR's branch, where CI does not start by itself
permissions: {contents: read}
env:
  CGO_ENABLED: "1"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: true}
      - run: go build ./...
      - run: go vet ./...
      - run: make cover-check
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: true}
      - uses: golangci/golangci-lint-action@v7
        with: {version: v2.13.2}
  integration:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'integration') || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: true}
      - run: go test -tags=integration -timeout=15m ./kafka/...
  darwin:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: true}
      - run: go test -short ./...
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: true}
      - run: make vuln
  release:
    # Runs last and only for pushes to main, once the pushed commit passed the
    # jobs below. It tags a merged release PR at that PR's own commit, so this
    # delays the tag of a red release commit but does not prevent it.
    if: github.event_name == 'push'
    needs: [test, lint, integration, vuln]
    runs-on: ubuntu-latest
    permissions: {contents: write, issues: write, pull-requests: write}
    steps:
      - uses: googleapis/release-please-action@v5
